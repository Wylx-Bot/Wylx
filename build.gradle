plugins {
    id 'application'
    id 'java'
    id 'java-library'
}

group = 'org.wylx'
version = "git describe --dirty --always --exclude '*'".execute().text.trim() ?: "unknown"

repositories {
    mavenCentral()
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'lavalink'
        url = 'https://maven.lavalink.dev/releases'
    }
}

dependencies {
    implementation("org.apache.commons:commons-text:1.10.0")
    implementation("io.github.cdimascio:dotenv-kotlin:6.5.1")
    implementation("net.dv8tion:JDA:6.3.1")
    implementation("ch.qos.logback:logback-classic:1.5.16")
    implementation("dev.arbjerg:lavaplayer:2.2.6") // https://github.com/lavalink-devs/lavaplayer
    implementation("dev.lavalink.youtube:v2:1.18.0")
    implementation("org.mongodb:mongodb-driver-sync:5.3.1")
    implementation("org.scilab.forge:jlatexmath:1.0.7")
    implementation("club.minnced:udpqueue-native-linux-x86-64:0.2.9")
    // Alpine uses musl instead of libc
    implementation("club.minnced:udpqueue-native-linux-musl-x86-64:0.2.9")
    implementation("club.minnced:udpqueue-native-win-x86-64:0.2.9")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass="com.wylxbot.wylx.Wylx"
}

// Remove version from output jar name
tasks.jar {
    archiveFileName = "${project.name}.jar"
}

tasks.distZip {
    archiveFileName = "${project.name}.zip"
}

// Create version.properties with git hash
tasks.register('createProperties') {
    dependsOn processResources
    doLast {
        layout.buildDirectory
                .file("resources/main/version.properties")
                .get().asFile
                .withWriter {w ->
            Properties p = new Properties()
            p['version'] = version.toString()
            p['build-date'] = new Date().format("EEE MMM dd HH':'mm':'ss zzz yyyy")
            p.store w, null
        }
    }
}

classes {
    dependsOn createProperties
}